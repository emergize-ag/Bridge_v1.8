<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="t d">
  <title id="t">Bridge — The Pause</title>
  <desc id="d">Logo concept C. A lowercase typographic wordmark "bridge" in Inter Light with a single short horizontal pause-bar above the first letter — the visual notation of a held breath, like a fermata. Anti-wellness, senior-leader register. Tagline below.</desc>
  <defs>
    <style>
      .ink   { fill:#1F2A37 }
      .pause { stroke:#1F2A37; stroke-width:5; stroke-linecap:round }
      .wm    { font-family:"Inter","Helvetica Neue",Arial,sans-serif; font-weight:300; letter-spacing:10px; fill:#1F2A37 }
      .tg    { font-family:"Inter","Helvetica Neue",Arial,sans-serif; font-weight:400; letter-spacing:1.8px; text-transform:uppercase; fill:#4B5563 }
    </style>
  </defs>
  <!-- Pause-bar: short horizontal line centred above the wordmark.
       Bar width = 44px. Centred on x=350 (same as wordmark text-anchor).
       y position = 142 (above wordmark ascender at ~155, gap of 13px). -->
  <line class="pause" x1="317" y1="142" x2="360" y2="142"/>
  <!-- Wordmark: Inter Light 300, 10px tracking, lowercase -->
  <text class="wm" x="350" y="230" font-size="62" text-anchor="middle">bridge</text>
  <!-- Tagline -->
  <text class="tg" x="350" y="278" font-size="13.5" text-anchor="middle">Moments to catch your breath.</text>
</svg>